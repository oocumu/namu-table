<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>나무틀 에디터</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Noto+Sans+KR:wght@400;500;700&family=IBM+Plex+Mono:wght@400;500&display=swap">
<link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/variable/pretendardvariable-dynamic-subset.min.css">
<style>
/* Layout: top bar + sticky format toolbar; left = form editor, right = live document on a "paper" sheet; tabs on phones */
:root{
  --bg:#eaeeec; --panel:#ffffff; --panel2:#f5f7f6; --line:#d6ddda; --fg:#1c2622; --muted:#5d6b65;
  --accent:#0a7a5f; --accent-ink:#ffffff; --accent-soft:#e0f1ea; --danger:#b23a30; --danger-soft:#fbe9e7;
  --desk:#d9dfdc; --paper:#ffffff;
  --font-ui:"Pretendard Variable","Pretendard","Noto Sans KR","Apple SD Gothic Neo","Malgun Gothic",sans-serif;
  --font-mono:"IBM Plex Mono",ui-monospace,Menlo,Consolas,monospace;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --bg:#111614; --panel:#1a211e; --panel2:#151b19; --line:#2c3632; --fg:#e3ebe7; --muted:#93a39c;
  --accent:#3fbf96; --accent-ink:#06261c; --accent-soft:#183329; --danger:#ef7f73; --danger-soft:#3a1f1c;
  --desk:#0c100e; --paper:#ffffff; color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#111614; --panel:#1a211e; --panel2:#151b19; --line:#2c3632; --fg:#e3ebe7; --muted:#93a39c;
  --accent:#3fbf96; --accent-ink:#06261c; --accent-soft:#183329; --danger:#ef7f73; --danger-soft:#3a1f1c;
  --desk:#0c100e; --paper:#ffffff; color-scheme:dark}
*{box-sizing:border-box}
html,body{height:100%}
body{background:var(--bg);color:var(--fg);font-family:var(--font-ui);font-size:14px;overflow:hidden}
button{font:inherit}
.app{height:100%;display:grid;grid-template-rows:auto auto 1fr}
.top{display:flex;align-items:center;gap:10px;flex-wrap:wrap;padding-block:10px;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));background:var(--panel);border-bottom:1px solid var(--line)}
.brand{display:flex;align-items:center;gap:9px;font-weight:700;font-size:16px;letter-spacing:-.01em}
.brand small{font-weight:500;color:var(--muted);font-size:12px}
.mark{width:26px;height:26px;border-radius:6px;background:var(--accent);display:grid;place-items:center}
.sp{flex:1}
.tabs{display:none;gap:4px;padding:6px max(16px,env(safe-area-inset-right,0px)) 6px max(16px,env(safe-area-inset-left,0px));background:var(--panel);border-bottom:1px solid var(--line)}
.tabs button{flex:1;padding:8px;border:1px solid var(--line);background:var(--panel2);color:var(--fg);border-radius:6px;cursor:pointer}
.tabs button[aria-pressed="true"]{background:var(--accent);color:var(--accent-ink);border-color:var(--accent)}
.main{display:grid;grid-template-columns:minmax(380px,540px) 1fr;min-height:0}
.edit{overflow:auto;background:var(--panel2);border-right:1px solid var(--line);min-width:0}
.prev{overflow:auto;background:var(--desk);min-width:0;padding:24px}
.page{max-width:880px;margin:0 auto;background:var(--paper);padding:28px 34px 40px;border-radius:4px;box-shadow:0 1px 3px rgba(0,0,0,.12)}
.prevlabel{max-width:880px;margin:0 auto 8px;font-size:12px;color:var(--muted);display:flex;justify-content:space-between}

.btn{padding:6px 11px;border:1px solid var(--line);border-radius:6px;background:var(--panel);color:var(--fg);cursor:pointer;font-size:13px;white-space:nowrap}
.btn:hover{border-color:var(--accent)}
.btn.pri{background:var(--accent);border-color:var(--accent);color:var(--accent-ink);font-weight:600}
.btn.sm{padding:4px 9px;font-size:12px}
.btn.armed,.ib.armed{background:var(--danger-soft);border-color:var(--danger);color:var(--danger)}
:focus-visible{outline:2px solid var(--accent);outline-offset:1px}

.tb{position:sticky;top:0;z-index:5;display:flex;flex-wrap:wrap;gap:4px;align-items:center;padding:8px 16px;background:var(--panel);border-bottom:1px solid var(--line)}
.tb button{min-width:32px;height:30px;padding:0 8px;border:1px solid var(--line);border-radius:5px;background:var(--panel2);color:var(--fg);cursor:pointer;font-size:13px}
.tb button:hover{border-color:var(--accent);color:var(--accent)}
.tb .sep{width:1px;height:20px;background:var(--line);margin:0 3px}
.tb input[type=color]{width:30px;height:30px;padding:2px;border:1px solid var(--line);border-radius:5px;background:var(--panel2);cursor:pointer}
.tb .hint{font-size:11px;color:var(--muted);width:100%}

.sec{padding:16px;border-bottom:1px solid var(--line);display:grid;gap:10px}
.sechead{display:flex;justify-content:space-between;align-items:center;gap:8px}
.sec h2{margin:0;font-size:13px;font-weight:700;letter-spacing:.02em}
.lab{font-size:12px;color:var(--muted);font-weight:500}
.f{display:grid;gap:4px;min-width:0}
.g2{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.g3{display:grid;grid-template-columns:1fr 1fr 1fr;gap:8px}
.in{width:100%;font:inherit;font-size:14px;padding:7px 9px;border:1px solid var(--line);border-radius:6px;background:var(--panel);color:var(--fg)}
.in:focus{outline:2px solid var(--accent);outline-offset:-1px}
textarea.in{resize:vertical;line-height:1.6;min-height:64px}
textarea.code{font-family:var(--font-mono);font-size:12px;line-height:1.5;min-height:220px}
select.in{padding:6px 8px}
.checks{display:flex;flex-wrap:wrap;gap:6px 16px}
.chk{display:flex;align-items:center;gap:6px;font-size:13px;cursor:pointer}
.chk input{accent-color:var(--accent);width:16px;height:16px}
.colors{display:flex;flex-wrap:wrap;gap:8px}
.clr{display:flex;align-items:center;gap:7px;padding:4px 10px 4px 4px;border:1px solid var(--line);border-radius:6px;background:var(--panel);font-size:12px;cursor:pointer}
.clr input{width:28px;height:24px;border:0;padding:0;background:none;cursor:pointer}
.clr code{font-family:var(--font-mono);color:var(--muted);font-size:11px}

.ibrows{display:grid;gap:6px}
.ibrow{display:grid;grid-template-columns:104px minmax(0,1fr) minmax(0,1.5fr) auto;gap:6px;align-items:center}
.ibrow .wide{grid-column:2 / 4}
.ibrow.hdr .in.lbl{font-weight:700;background:var(--accent-soft)}
.ibfold{grid-column:1 / -1;display:grid;gap:6px;padding:8px 10px;border-left:3px solid var(--accent);background:var(--panel);border-radius:0 6px 6px 0}
.galrow{display:grid;gap:6px;padding:8px;border:1px solid var(--line);border-radius:6px;background:var(--panel2)}
.galsub{display:flex;gap:4px;align-items:center}
.galsub .in{flex:1;min-width:0}
.in.w120{width:120px}
.ctl{display:flex;gap:3px}
.ib{width:28px;height:28px;border:1px solid var(--line);border-radius:5px;background:var(--panel);color:var(--fg);cursor:pointer;font-size:12px;padding:0;white-space:nowrap}
.ib.armed{width:auto;padding:0 6px}
.ib:disabled{opacity:.35;cursor:default}
.ib:hover:not(:disabled){border-color:var(--accent)}

.imgf{display:flex;gap:6px;align-items:center;flex-wrap:wrap}
.imgf .in{flex:1;min-width:160px}
.imgchip{display:flex;align-items:center;gap:8px;flex:1;min-width:0;padding:4px;border:1px solid var(--line);border-radius:6px;background:var(--panel);font-size:12px;color:var(--muted)}
.imgchip img{width:40px;height:40px;object-fit:cover;border-radius:4px;flex:none}
.note{font-size:12px;color:var(--muted);line-height:1.55;margin:0}

.card{background:var(--panel);border:1px solid var(--line);border-radius:8px}
.cards{display:grid;gap:10px}
.bhead{display:flex;align-items:center;justify-content:space-between;gap:8px;padding:6px 8px 6px 12px;border-bottom:1px solid var(--line)}
.btype{font-size:12px;font-weight:700;color:var(--accent)}
.btype span{font-family:var(--font-mono);color:var(--muted);font-weight:500;margin-left:6px}
.bbody{padding:10px 12px;display:grid;gap:8px}
.card.h1 .bhead{background:var(--accent-soft)}
.lvl{display:grid;grid-template-columns:110px 1fr;gap:6px}
.gridwrap{overflow-x:auto;border:1px solid var(--line);border-radius:6px;background:var(--panel2)}
.gtable{border-collapse:collapse}
.gtable td{padding:3px}
.gtable .in{min-width:120px;font-size:13px;padding:5px 7px}
.gtable tr:first-child .in.hd{font-weight:700;background:var(--accent-soft)}
.gtable .cc{text-align:center}
.addbar{display:flex;flex-wrap:wrap;gap:6px;padding:12px;border:1px dashed var(--line);border-radius:8px;background:var(--panel)}
.addbar .lab{width:100%}

details.help summary{cursor:pointer;font-weight:700;font-size:13px}
.syn{display:grid;grid-template-columns:auto 1fr;gap:6px 12px;margin-top:10px;font-size:12.5px}
.syn code{font-family:var(--font-mono);background:var(--panel);border:1px solid var(--line);border-radius:4px;padding:1px 6px;white-space:nowrap}

.modal{position:fixed;inset:0;z-index:50;background:rgba(10,16,14,.5);display:grid;place-items:center;padding:16px}
.mbox{width:min(720px,100%);max-height:calc(100% - 20px);overflow:auto;background:var(--panel);border:1px solid var(--line);border-radius:10px;padding:18px;display:grid;gap:12px}
.mhead{display:flex;justify-content:space-between;align-items:center}
.mhead h3{margin:0;font-size:16px}
.steps{margin:0;padding-left:20px;line-height:1.7;font-size:13.5px}
.row{display:flex;gap:8px;flex-wrap:wrap;align-items:center}
.end{justify-content:flex-end}
.toast{position:fixed;left:50%;bottom:calc(20px + env(safe-area-inset-bottom,0px));transform:translateX(-50%);background:var(--fg);color:var(--bg);padding:9px 16px;border-radius:20px;font-size:13px;z-index:60;opacity:0;transition:opacity .2s;pointer-events:none}
.toast.on{opacity:1}

@media (max-width:860px){
  .tabs{display:flex}
  .main{grid-template-columns:1fr}
  .app[data-view="edit"] .prev{display:none}
  .app[data-view="prev"] .edit{display:none}
  .edit{border-right:0}
  .prev{padding:12px}
  .page{padding:18px 16px 28px}
  .in,.gtable .in{font-size:16px}
  .ibrow{grid-template-columns:1fr auto}
  .ibrow > select{grid-column:1 / 2}
  .ibrow .ctl{grid-column:2;grid-row:1}
  .ibrow > .in,.ibrow .wide{grid-column:1 / 3}
  .g3{grid-template-columns:1fr 1fr}
  .brand small{display:none}
}
@media (prefers-reduced-motion:reduce){*{transition:none!important;scroll-behavior:auto!important}}
</style>
<style>body{margin:0}img{max-width:100%}[hidden]{display:none!important}</style>
</head>
<body>

<div class="app" id="app" data-view="edit">
  <header class="top">
    <div class="brand"><span class="mark" aria-hidden="true"><svg width="16" height="16" viewBox="0 0 16 16"><path d="M8 1.5c3.2 2.1 4.6 4.6 4.1 7.4C11.7 11.3 10 13 8 13.8 6 13 4.3 11.3 3.9 8.9 3.4 6.1 4.8 3.6 8 1.5z" fill="var(--accent-ink)"/><path d="M8 5v10" stroke="var(--accent-ink)" stroke-width="1.4" stroke-linecap="round" opacity=".7"/></svg></span>나무틀 <small>위키 스타일 문서 → 티스토리 HTML</small></div>
    <div class="sp"></div>
    <button class="btn" id="btnNew" type="button">새 문서</button>
    <button class="btn" id="btnBackup" type="button">백업 · 불러오기</button>
    <button class="btn" id="btnExport" type="button">HTML 보기</button>
    <button class="btn pri" id="btnCopy" type="button">HTML 복사</button>
  </header>
  <nav class="tabs" aria-label="화면 전환">
    <button type="button" data-v="edit" aria-pressed="true">편집</button>
    <button type="button" data-v="prev" aria-pressed="false">미리보기</button>
  </nav>
  <div class="main">
    <div class="edit" id="edit">
      <div class="tb" id="tb" role="toolbar" aria-label="글자 꾸미기">
        <button type="button" data-act="b" title="굵게"><b>B</b></button>
        <button type="button" data-act="i" title="기울임"><i>I</i></button>
        <button type="button" data-act="u" title="밑줄"><u>U</u></button>
        <button type="button" data-act="s" title="취소선"><s>S</s></button>
        <button type="button" data-act="sup" title="위첨자">x²</button>
        <span class="sep"></span>
        <button type="button" data-act="link" title="링크 걸기">🔗 링크</button>
        <button type="button" data-act="fn" title="주석 달기">[*] 주석</button>
        <button type="button" data-act="br" title="줄바꿈 (한 줄 칸용)">↵ 줄바꿈</button>
        <span class="sep"></span>
        <input type="color" id="tbColor" value="#c0392b" title="글자색 고르기" aria-label="글자색">
        <button type="button" data-act="color" title="고른 색 적용">색 적용</button>
        <div class="hint">글을 쓸 칸을 누르고, 꾸밀 부분을 드래그한 뒤 버튼을 누르세요.</div>
      </div>
      <div id="editorBody"></div>
    </div>
    <div class="prev" id="prevPane">
      <div class="prevlabel"><span>미리보기 · 내보내는 HTML과 똑같이 그려집니다</span><span id="sizeInfo"></span></div>
      <div class="page" id="page"></div>
    </div>
  </div>
</div>
<div class="toast" id="toast" role="status"></div>

<script>
(function(){
const LS_KEY='namutle-v1';
const LINK='#0275d8', EXT='#1a8a3a';
const $=s=>document.querySelector(s);
const uid=()=>Math.random().toString(36).slice(2,9);

/* ---------- data ---------- */
const SAMPLE_IMG='data:image/svg+xml;utf8,'+encodeURIComponent('<svg xmlns="http://www.w3.org/2000/svg" width="400" height="460" viewBox="0 0 400 460"><defs><linearGradient id="g" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#d4def0"/><stop offset="1" stop-color="#8aa1cf"/></linearGradient></defs><rect width="400" height="460" fill="url(#g)"/><circle cx="200" cy="170" r="76" fill="#2b4a8b" opacity=".85"/><path d="M68 460c10-118 70-178 132-178s122 60 132 178z" fill="#2b4a8b" opacity=".85"/><text x="200" y="438" font-family="sans-serif" font-size="20" fill="#ffffff" text-anchor="middle">예시 이미지</text></svg>');

function blank(){
  return {title:'',categories:'',showTitle:true,showToc:true,fixBg:true,loadFont:true,foldMode:'details',_v3:true,
    infobox:{enabled:true,title:'',subtitle:'',color:'#2b4a8b',textColor:'#ffffff',borderColor:'#2b4a8b',width:'330px',align:'right',valueAlign:'center',image:'',caption:'',
      rows:[{id:uid(),type:'row',label:'이름',value:''}]},
    blocks:[{id:uid(),type:'heading',level:1,text:'개요'},{id:uid(),type:'text',text:''}]};
}
function sample(){
  const s=blank();
  s.title='아델 린드버그'; s.categories='등장인물, 북해 연합 기사단';
  Object.assign(s.infobox,{title:'아델 린드버그',subtitle:'Adel Lindberg',image:SAMPLE_IMG,caption:'기사단 정복 차림 (예시 이미지)',rows:[
    {id:uid(),type:'header',label:'기본 정보',value:''},
    {id:uid(),type:'row',label:'나이',value:'27세'},
    {id:uid(),type:'row',label:'생일',value:'2월 11일'},
    {id:uid(),type:'row',label:'신장',value:'172cm'},
    {id:uid(),type:'row',label:'소속',value:'[[https://example.com|북해 연합 기사단]]'},
    {id:uid(),type:'row',label:'직위',value:'제3대대 대장[* 역대 최연소 대대장이다.]'},
    {id:uid(),type:'header',label:'특징',value:''},
    {id:uid(),type:'row',label:'무기',value:"쌍검 ''서리꽃''"},
    {id:uid(),type:'row',label:'좋아하는 것',value:'홍차, 겨울 바다'},
    {id:uid(),type:'row',label:'싫어하는 것',value:'늦잠, 단 음식'},
    {id:uid(),type:'fold',label:'설정화',foldTitle:'[펼치기 · 접기]',value:'',imgWidth:'46%',images:[{src:SAMPLE_IMG,caption:'정면'},{src:SAMPLE_IMG,caption:'뒷모습'}]},
    {id:uid(),type:'full',label:'',value:"{{{#2b4a8b '''차가운 머리, 뜨거운 칼.'''}}}"}
  ]});
  s.blocks=[
    {id:uid(),type:'heading',level:1,text:'개요'},
    {id:uid(),type:'quote',text:"'''검은 깃발 아래에서 물러선 적은 한 번도 없다.'''\n― 아델 린드버그, 북해 방어전 직후"},
    {id:uid(),type:'text',text:"북해 연합 기사단 제3대대를 이끄는 대장. 차분한 말투와 빈틈없는 판단으로 부하들의 신뢰를 받는다.[* 대대원들 사이에서는 '얼음 대장'이라는 별명으로 통한다.]\n전장에서는 쌍검술을 주로 쓰며, 겨울 정령과 맺은 계약 덕분에 냉기 계열 기술에 강하다."},
    {id:uid(),type:'heading',level:1,text:'외모'},
    {id:uid(),type:'text',text:'은빛이 도는 짧은 흑발과 회청색 눈. 기사단 정복 위에 낡은 남색 망토를 두르는데, 전임 대장에게서 물려받은 것이다.[* 망토 안쪽에는 역대 대장들의 이름이 수놓여 있다.]'},
    {id:uid(),type:'heading',level:1,text:'성격'},
    {id:uid(),type:'text',text:"겉으로는 ''무뚝뚝하고 엄격''하지만 부하의 이름과 생일을 전부 외우고 있을 만큼 세심하다. 다만 {{{#c0392b 단 음식}}}만 보면 표정이 굳는다."},
    {id:uid(),type:'heading',level:1,text:'능력'},
    {id:uid(),type:'heading',level:2,text:'쌍검술'},
    {id:uid(),type:'text',text:'양손에 같은 길이의 검을 쥐고 쉴 틈 없이 몰아치는 방식. 방어보다 흐름을 끊지 않는 데 중점을 둔다.'},
    {id:uid(),type:'heading',level:2,text:'정령 계약'},
    {id:uid(),type:'table',headerRow:true,headerCol:false,headColor:'#2b4a8b',headText:'#ffffff',borderColor:'#cccccc',width:'100%',align:'center',cellAlign:'left',caption:'',
      rows:[['기술','속성','설명'],['서리 매듭','냉기','상대의 발을 얼려 묶는다.'],['백야의 장막','냉기·방어','짧은 시간 동안 냉기 방벽을 친다.'],['겨울 숨결','냉기','검에 냉기를 실어 베어낸다.[* 연속으로 쓰면 손끝이 얼어붙는 부작용이 있다.]']]},
    {id:uid(),type:'heading',level:1,text:'주요 전적'},
    {id:uid(),type:'table',headerRow:true,headerCol:false,headColor:'#e8edf6',headText:'#2b4a8b',borderColor:'#cccccc',width:'100%',align:'center',cellAlign:'center',caption:'',
      rows:[['연도','사건','결과'],['1021','북해 방어전','<#e6f4ea>승리'],['1023','서리 협곡 토벌','<#fbe9e7>철수'],['1024','<-2>제3대대 대장 취임','']]},
    {id:uid(),type:'heading',level:1,text:'인간관계'},

function readImage(file,cb){
  if(!file)return;
  if(file.type==='image/gif'||file.type==='image/svg+xml'){const r=new FileReader(); r.onload=()=>cb(r.result); r.readAsDataURL(file); return;}
  const url=URL.createObjectURL(file); const img=new Image();
  img.onload=()=>{ let w=img.naturalWidth,hh=img.naturalHeight; const max=1200; if(w>max){hh=Math.round(hh*max/w);w=max;}
    const cv=document.createElement('canvas'); cv.width=w; cv.height=hh; cv.getContext('2d').drawImage(img,0,0,w,hh);
    cb(cv.toDataURL(file.type==='image/png'?'image/png':'image/jpeg',0.86)); URL.revokeObjectURL(url); };
  img.onerror=()=>toast('이미지 파일을 읽지 못했어요. 다른 파일로 시도해 보세요.');
  img.src=url;

function applyFmt(kind){

  switch(kind){
    case 'b':wrap("'''",'굵은 글씨');break;
    case 'i':wrap("''",'기울인 글씨');break;
    case 'u':wrap('__','밑줄 글씨');break;
    case 's':wrap('~~','취소할 글씨');break;

  let ok=false; try{ok=document.execCommand('copy');}catch(e){} t.remove();
  if(ok)return Promise.resolve(true);
  if(navigator.clipboard&&navigator.clipboard.writeText)return navigator.clipboard.writeText(text).then(()=>true,()=>false);
  return Promise.resolve(false);
}
function copyFrom(ta,msg){
  copyText(ta.value).then(ok=>{ if(ok)toast(msg||'복사했어요'); else {ta.focus();ta.select();toast('전체 선택해 뒀어요. Ctrl+C(⌘+C)로 복사하세요');} });
}
function openExport(){
  const html=renderDoc(state,true);
  const ta=h('textarea',{class:'in code',readOnly:true,rows:12,'aria-label':'내보낸 HTML',onclick:e=>e.target.select(),onfocus:e=>e.target.select()}); ta.value=html;
  const hasData=/src="data:/.test(html);
  openModal('티스토리용 HTML',
    h('ol',{class:'steps'},
      h('li',{},'티스토리 글쓰기 화면 오른쪽 위의 ',h('b',{},'기본모드'),'를 눌러 ',h('b',{},'HTML'),'로 바꿉니다.'),
      h('li',{},'아래 코드를 복사해 그대로 붙여넣습니다.'),
      h('li',{},'기본모드로 되돌리지 말고 바로 발행하세요. 되돌리면 편집기가 스타일 일부를 지울 수 있어요.')),
    ta,
    h('div',{class:'row end'},h('span',{class:'note',style:'flex:1'},`${Math.max(1,Math.round(new Blob([html]).size/1024))} KB · 스타일은 모두 태그 안에 들어 있어 스킨 CSS에 덜 흔들립니다.`),h('button',{class:'btn pri',type:'button',onclick:()=>copyFrom(ta,'HTML을 복사했어요')},'HTML 복사')),
    hasData?h('p',{class:'note'},'파일에서 넣은 이미지가 HTML 안에 통째로 들어가 있어요. 글이 무거워지거나 티스토리가 이미지를 거를 수 있으니, 티스토리에 이미지를 먼저 올리고 그 주소를 이미지 칸에 붙여넣는 쪽을 추천해요.'):null,
    state.loadFont?h('p',{class:'note'},'맨 앞줄의 <link>가 프리텐다드 글꼴을 불러옵니다. 글꼴이 안 바뀌면 이 한 줄을 티스토리 [꾸미기 → 스킨 편집 → html]의 <head> 안에 넣어 두세요. 그러면 모든 글에 적용돼요.'):null,
    h('p',{class:'note'},state.foldMode==='tistory'?'접기는 티스토리 더보기 블록으로 내보냈어요. 버튼 모양은 스킨의 더보기 디자인을 따라요.':'접기가 티스토리에서 펼쳐지지 않으면 문서 설정의 접기 방식을 “티스토리 더보기 블록”으로 바꿔 다시 내보내 보세요.'));
  requestAnimationFrame(()=>{ta.focus();ta.select();});
}
$('#btnExport').onclick=openExport;
$('#btnCopy').onclick=()=>{
  copyText(renderDoc(state,true)).then(ok=>{
    if(ok)toast('HTML을 복사했어요. 티스토리 HTML 모드에 붙여넣으세요');
    else {openExport(); toast('자동 복사가 막혔어요. 전체 선택해 뒀으니 Ctrl+C(⌘+C)를 누르세요');}
  });
};
$('#btnBackup').onclick=()=>{
  const ta=h('textarea',{class:'in code',rows:10,'aria-label':'백업 데이터'}); ta.value=JSON.stringify(state);
  const file=h('input',{type:'file',accept:'.json,application/json,text/plain',hidden:true});
  let close;
  const load=txt=>{try{const o=JSON.parse(txt); if(!o||!Array.isArray(o.blocks))throw 0; const old=!o._v3; state=normalize(o); if(old)migrate(state); structural(); close(); toast('불러왔어요');}catch(e){toast('백업 형식이 아니에요. 복사한 내용을 그대로 붙여넣어 주세요.');}};
  file.onchange=()=>{const f=file.files[0]; if(!f)return; const r=new FileReader(); r.onload=()=>load(String(r.result)); r.readAsText(f);};
  close=openModal('백업 · 불러오기',
    h('p',{class:'note'},'작성 중인 문서는 이 브라우저에 자동 저장됩니다. 다른 기기로 옮기거나 여러 문서를 따로 두려면 아래 내용을 복사해 메모장 등에 보관하세요.'),
    ta,
    h('div',{class:'row'},
      h('button',{class:'btn pri',type:'button',onclick:()=>copyFrom(ta,'백업 내용을 복사했어요')},'백업 복사'),
      h('button',{class:'btn',type:'button',onclick:()=>load(ta.value)},'붙여넣은 내용으로 불러오기'),
      h('button',{class:'btn',type:'button',onclick:()=>file.click()},'파일에서 불러오기'),file,
      h('span',{class:'sp'}),
      h('button',{class:'btn',type:'button',onclick:()=>{state=sample();structural();close();toast('예시 문서를 불러왔어요');}},'예시 문서 보기')));
};
(function(){const b=$('#btnNew'); let t;
  b.onclick=()=>{ if(b.dataset.armed){clearTimeout(t);delete b.dataset.armed;b.textContent='새 문서';b.classList.remove('armed');state=blank();structural();toast('빈 문서로 시작합니다');return;}
    b.dataset.armed='1'; b.textContent='지금 문서를 비울까요?'; b.classList.add('armed');
    t=setTimeout(()=>{delete b.dataset.armed;b.textContent='새 문서';b.classList.remove('armed');},3000); };
})();

renderEditor(); paint();
})();
</script>
